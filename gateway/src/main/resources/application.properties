# Nombre de la aplicación (como aparecerá en Eureka)
spring.application.name=gateway-service
server.port=9091

# Configuración de Eureka Client
#eureka.client.service-url.defaultZone=http://172.18.0.200:8761/eureka/
eureka.client.service-url.defaultZone=http://discovery:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Forzar el uso de la IP local para que NGINX lo encuentre
eureka.instance.prefer-ip-address=true
#eureka.instance.ip-address=192.168.100.3
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Configuración de Rutas Específicas
spring.cloud.gateway.server.webmvc.routes[0].id=USUARIO-ROUTE
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webmvc.routes[1].id=RESERVAS-ROUTE
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://RESERVATION-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/reservations/**



