spring.application.name=reservation-service

#Puerto de la aplicación
server.port=0

# Configuración de la conexión (MySQL Local)
spring.datasource.url=jdbc:mysql://reservas-db:3306/elbuensabor_db?createDatabaseIfNotExist=true
spring.datasource.username=redStak
spring.datasource.password=qu1Nch1nK
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect


# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración de conexión a RabbitMQ
# El host debe coincidir con el nombre del servicio en el docker-compose
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672

# configuracion de eureka client
eureka.client.service-url.defaultZone=http://discovery:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Forzar el uso de tu IP local para el registro
eureka.instance.prefer-ip-address=true
#eureka.instance.ip-address=192.168.100.3
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Enable displaying Actuator endpoints in the OpenAPI documentation
springdoc.show-actuator=true

# Expose 'openapi' and 'swagger-ui' endpoints under the /actuator base path
management.endpoints.web.exposure.include=health,info,openapi,swagger-ui
